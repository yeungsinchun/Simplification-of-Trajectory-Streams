name: Deploy

# Build the Dockerfile via Cloud Build and publish the web viewer to Cloud Run.
# Auth uses Workload Identity Federation (no JSON key secret). Optional overrides:
# repository variables GCP_PROJECT_ID, GCP_REGION, CLOUD_RUN_SERVICE,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'project-ec366840-6857-446e-852' }}
      REGION: ${{ vars.GCP_REGION || 'asia-east2' }}
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'simplify-viewer' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/522405269791/locations/global/workloadIdentityPools/github-actions/providers/github' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-actions-deploy@project-ec366840-6857-446e-852.iam.gserviceaccount.com' }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        # Matches the former local deploy.sh flags:
        # --no-cpu-throttling keeps CPU for background Julia Fréchet work after /api/frechet returns
        # --memory 4Gi covers large traces + CGAL + Julia
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --platform managed \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --no-cpu-throttling

      - name: Publish service URL
        run: |
          url=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.url)')
          echo "Deployed: $url"
          {
            echo "## Cloud Run"
            echo ""
            echo "- Service: \`$SERVICE_NAME\`"
            echo "- Region: \`$REGION\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
