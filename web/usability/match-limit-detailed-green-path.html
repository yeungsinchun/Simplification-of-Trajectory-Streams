<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>match limit tip: detailed green path</title>
<style>
  html, body {
    width: 900px;
    max-width: 900px;
    margin: 0 auto;
    overflow-x: hidden;
  }
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-border: #262b36;
    --text: #e6e8ec;
    --text-dim: #8b93a3;
    --accent: #26bf90;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    padding: 16px;
  }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: var(--text-dim); font-size: 12px; max-width: 860px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .frame {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px;
  }
  .label {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .chip {
    display: block;
    margin-top: 0;
    padding: 8px 10px;
    border-radius: 6px;
    background: #1c2230;
    border: 1px solid var(--panel-border);
    font-size: 12px;
    line-height: 1.45;
  }
  .check {
    margin-top: 12px;
    font-size: 12px;
    color: var(--accent);
  }
  .check.bad { color: #f87171; }
</style>
</head>
<body>
  <h1>match limit tip: detailed green path</h1>
  <p>
    After Match and DP tips said <b>A smaller Match/match keeps a more detailed green path</b>,
    the loaded <b>match limit</b> chip still led with <b>Upper Match limit</b> and had no smaller/outcome guidance.
  </p>
  <div class="grid">
    <div class="frame">
      <div class="label">Before</div>
      <span class="chip" title="Upper Match limit for this run: how far the green path may drift from the Gray path. Same idea as the Match field.">
        match limit <b>927.7</b>
      </span>
    </div>
    <div class="frame">
      <div class="label">After</div>
      <span class="chip" id="matchLimitChip" title="Match limit for this run (same idea as the Match field): how far the green path may drift from the Gray path. A smaller match limit keeps a more detailed green path.">
        match limit <b>927.7</b>
      </span>
    </div>
  </div>
  <div id="check" class="check">Checking…</div>
  <script>
    const chip = document.getElementById("matchLimitChip");
    const tip = chip.title;
    const scrollWidth = document.documentElement.scrollWidth;
    const ok =
      tip.includes("A smaller match limit keeps a more detailed green path")
      && tip.includes("same idea as the Match field")
      && !tip.includes("Upper Match limit")
      && scrollWidth <= 900;
    const el = document.getElementById("check");
    el.textContent = `ok=${ok} scrollWidth=${scrollWidth}`;
    el.className = "check" + (ok ? "" : " bad");
  </script>
</body>
</html>
