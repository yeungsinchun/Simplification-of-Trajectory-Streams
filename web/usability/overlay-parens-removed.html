<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map overlays without English parentheses</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-border: #262b36;
    --text: #e6e8ec;
    --text-dim: #8b93a3;
    --accent: #3ddc97;
    --danger: #ff5f6d;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 900px; overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    padding: 16px;
  }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: var(--text-dim); font-size: 12px; max-width: 720px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 900px; }
  .frame {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px;
  }
  .label {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  h2 {
    margin: 0 0 8px;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .toggle-row { padding: 4px 0; font-size: 12.5px; }
  .toggle-row label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .swatch {
    width: 12px; height: 12px;
    border-radius: 3px;
    display: inline-block;
  }
  .math {
    font-family: "Times New Roman", Times, serif;
    font-style: italic;
  }
  .bad { color: var(--danger); }
  .ok { color: var(--accent); margin-top: 12px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Map overlays without English parentheses</h1>
  <p>
    Overlay row labels keep paper math only. Trailing English glosses in parentheses
    are removed from the visible label (tooltips still explain).
  </p>
  <div class="grid">
    <div class="frame" id="before">
      <div class="label">Before</div>
      <h2>Map overlays</h2>
      <div class="toggle-row"><label><input type="checkbox" checked /><span class="swatch" style="background:#c47aff"></span><span class="math">B<sub>p</sub></span> <span class="bad">(δ-ball at start vertex)</span></label></div>
      <div class="toggle-row"><label><input type="checkbox" checked /><span class="swatch" style="background:#ff7ae8"></span><span class="math">B<sub>v<sub>i</sub></sub></span> <span class="bad">(δ-ball at current vertex)</span></label></div>
      <div class="toggle-row"><label><input type="checkbox" checked /><span class="swatch" style="background:#ff9f43"></span><span class="math">P</span> <span class="bad">(candidate anchors)</span></label></div>
    </div>
    <div class="frame" id="after">
      <div class="label">After</div>
      <h2>Map overlays</h2>
      <div class="toggle-row" id="bpRow"><label title="δ-ball around the start vertex p of the current segment."><input type="checkbox" checked /><span class="swatch" style="background:#c47aff"></span><span class="math">B<sub>p</sub></span></label></div>
      <div class="toggle-row" id="bviRow"><label title="δ-ball around the current stream vertex v_i."><input type="checkbox" checked /><span class="swatch" style="background:#ff7ae8"></span><span class="math">B<sub>v<sub>i</sub></sub></span></label></div>
      <div class="toggle-row" id="pRow"><label title="Candidate anchors on the search boundary."><input type="checkbox" checked /><span class="swatch" style="background:#ff9f43"></span><span class="math">P</span></label></div>
    </div>
  </div>
  <p class="ok" id="check">Measuring…</p>
<script>
  function labelText(id) {
    const label = document.querySelector("#" + id + " label");
    return (label ? label.textContent : "").replace(/\s+/g, " ").trim();
  }
  const after = document.getElementById("after").textContent;
  const bp = labelText("bpRow");
  const bvi = labelText("bviRow");
  const p = labelText("pRow");
  const noParens = !bp.includes("(") && !bvi.includes("(") && !p.includes("(")
    && !after.includes("δ-ball at") && !after.includes("candidate anchors");
  const hasSymbols = bp.includes("B") && bvi.includes("B") && p === "P";
  const scroll = document.documentElement.scrollWidth;
  const ok = noParens && hasSymbols && scroll <= 900;
  document.getElementById("check").textContent =
    `noParens=${noParens} hasSymbols=${hasSymbols} scrollWidth=${scroll} ok=${ok}`;
</script>
</body>
</html>
