<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compare Score header and plain DP/DOTS tooltips</title>
<style>
  html, body {
    width: 900px;
    max-width: 900px;
    margin: 0 auto;
    overflow-x: hidden;
  }
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-border: #262b36;
    --text: #e6e8ec;
    --text-dim: #8b93a3;
    --accent: #26bf90;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    padding: 16px;
  }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: var(--text-dim); font-size: 12px; max-width: 860px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .frame {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px;
  }
  .label {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  th, td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--panel-border);
  }
  th { color: var(--text-dim); font-weight: 600; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 0 4px 6px 0;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: #1c2230;
    color: var(--text);
    font-size: 12px;
  }
  .pill.active {
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill-gloss { color: var(--text-dim); font-size: 10px; }
  .field {
    display: block;
    margin-top: 8px;
    color: var(--text-dim);
    font-size: 12px;
  }
  #check {
    margin-top: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <h1>Scores “Score” + plain Compare tooltips</h1>
  <p>
    Before: Scores used a “Metric” column and DP/DOTS tooltips said Douglas-Peucker /
    point-to-edge / streaming simplifier. After: Score header plus plain path-shortener wording.
  </p>
  <div class="grid">
    <div class="frame" id="before">
      <div class="label">Before</div>
      <table>
        <thead>
          <tr><th>Metric</th><th>This run</th></tr>
        </thead>
        <tbody>
          <tr><td>Match error</td><td>0.42</td></tr>
        </tbody>
      </table>
      <button class="pill active" type="button"
        title="DP: classic point-to-edge simplifier (Douglas-Peucker style). Needs a preloaded trajectory.">
        DP<span class="pill-gloss">classic</span>
      </button>
      <button class="pill" type="button"
        title="DOTS: another streaming simplifier to score against. Needs a preloaded trajectory.">
        DOTS<span class="pill-gloss">stream</span>
      </button>
      <label class="field" title="DP allowed point-to-edge error (same idea as Match).">DP match</label>
    </div>
    <div class="frame" id="after">
      <div class="label">After</div>
      <table>
        <thead>
          <tr><th>Score</th><th>This run</th></tr>
        </thead>
        <tbody>
          <tr><td>Match error</td><td>0.42</td></tr>
        </tbody>
      </table>
      <button class="pill active" type="button" id="dpPill"
        title="DP: classic path shortener that drops points within a match limit. Needs a preloaded trajectory.">
        DP<span class="pill-gloss">classic</span>
      </button>
      <button class="pill" type="button" id="dotsPill"
        title="DOTS: another stream path shortener to score against. Needs a preloaded trajectory.">
        DOTS<span class="pill-gloss">stream</span>
      </button>
      <label class="field" id="dpField" title="DP allowed match error (same idea as Match).">DP match</label>
    </div>
  </div>
  <div id="check"></div>
  <script>
    const before = document.getElementById("before").innerText
      + [...document.querySelectorAll("#before [title]")].map((el) => el.title).join(" ");
    const after = document.getElementById("after").innerText
      + [...document.querySelectorAll("#after [title]")].map((el) => el.title).join(" ");
    const ok =
      before.includes("Metric")
      && before.includes("Douglas-Peucker")
      && before.includes("point-to-edge")
      && before.includes("streaming simplifier")
      && after.includes("Score")
      && !after.includes("Metric")
      && !after.includes("Douglas-Peucker")
      && !after.includes("point-to-edge")
      && !after.includes("streaming simplifier")
      && document.getElementById("dpPill").title.includes("path shortener")
      && document.getElementById("dotsPill").title.includes("stream path shortener")
      && document.getElementById("dpField").title.includes("match error")
      && document.documentElement.scrollWidth <= 900;
    document.getElementById("check").textContent =
      `ok=${ok} scrollWidth=${document.documentElement.scrollWidth} afterScore=${after.includes("Score")} noDouglas=${!after.includes("Douglas-Peucker")}`;
  </script>
</body>
</html>
