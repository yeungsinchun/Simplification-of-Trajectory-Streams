name: CI - Correctness and Performance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libcgal-dev qtbase5-dev
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --target simplify -j$(nproc)
    
    - name: Run correctness tests
      id: correctness
      run: |
        echo "Running correctness tests..."
        
        # Test case 1: Basic simplification
        ./build/simplify 1 -e 299 -d 1 --out
        
        if [ ! -f "data/1/simplify.txt" ]; then
          echo "❌ Output file not generated"
          exit 1
        fi
        
        # Count output points
        output_points=$(wc -l < data/1/simplify.txt)
        echo "Output points: $output_points"
        
        # Expected: 92 points (15.6463% of 588)
        if [ "$output_points" -ne 92 ]; then
          echo "❌ Expected 92 points, got $output_points"
          exit 1
        fi
        
        echo "✅ Correctness test passed"
    
    - name: Run performance benchmarks
      id: performance
      run: |
        echo "Running performance benchmarks..."
        echo "| Test Case | Points | Epsilon | Delta | Time (ms) | Output Points | Compression % |" > bench_results.md
        echo "|-----------|--------|---------|-------|-----------|---------------|---------------|" >> bench_results.md
        
        # Test case 1
        output=$(./build/simplify 1 -e 299 -d 1 2>&1)
        time_ms=$(echo "$output" | grep "SIMPLIFY_CORE_MS:" | awk '{print $2}')
        output_pts=$(echo "$output" | grep "Simplified to" | awk '{print $3}')
        compression=$(echo "$output" | grep "Simplified to" | awk '{print $5}' | tr -d '().')
        
        echo "| 1 | 588 | 299 | 1 | $time_ms | $output_pts | $compression% |" >> bench_results.md
        
        cat bench_results.md
        
        # Performance threshold: should complete in under 200ms on CI
        time_int=$(echo "$time_ms" | cut -d. -f1)
        if [ "$time_int" -gt 200 ]; then
          echo "⚠️ Warning: Performance regression detected (${time_ms}ms > 200ms threshold)"
        else
          echo "✅ Performance check passed (${time_ms}ms)"
        fi
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: bench_results.md
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const results = fs.readFileSync('bench_results.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.name,
            body: `## 📊 Performance Benchmark Results\n\n${results}`
          });
