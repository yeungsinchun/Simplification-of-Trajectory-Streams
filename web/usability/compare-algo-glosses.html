<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compare algorithm glosses</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-border: #262b36;
    --text: #e6e8ec;
    --text-dim: #8b93a3;
    --accent: #4f9dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  section { padding: 14px; max-width: 900px; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: var(--text-dim); font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .frame {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px;
  }
  .label {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .pill {
    appearance: none;
    border: 1px solid var(--panel-border);
    background: #1a1f29;
    color: var(--text-dim);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 650;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1.15;
    margin: 0 6px 6px 0;
  }
  .pill .g { font-size: 9px; font-weight: 550; opacity: 0.75; }
  .header-row { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; white-space: nowrap; }
  .header-row .pill { flex-direction: row; padding: 5px 12px; font-size: 11px; }
  .header-row .pill .g { display: none; }
  .map {
    margin-top: 10px;
    height: 56px;
    border: 1px dashed var(--panel-border);
    border-radius: 6px;
    position: relative;
    background: #12151c;
  }
  .tag {
    position: absolute;
    font: bold 11px -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .tag.start { color: #ff9f43; left: 18px; top: 18px; }
  .tag.cur { color: #ff7ae8; left: 120px; top: 28px; }
  .ok { color: #3ddc97; margin-top: 12px; font-size: 12px; }
</style>
</head>
<body>
<section>
  <h1>Compare algorithm glosses + canvas current</h1>
  <p>
    Results pills showed bare DOTS / DP / SQUISH (tooltips only). Phones cannot hover.
    Canvas said <b>cur</b> while Status said <b>current point</b>.
  </p>
  <div class="grid">
    <div class="frame">
      <div class="label">Before</div>
      <div>
        <button class="pill" type="button">DOTS</button>
        <button class="pill" type="button">DP</button>
        <button class="pill" type="button">SQUISH</button>
      </div>
      <div class="map">
        <span class="tag start">start</span>
        <span class="tag cur">cur</span>
      </div>
    </div>
    <div class="frame" id="after">
      <div class="label">After (Results + header strip)</div>
      <div id="resultsPills">
        <button class="pill" type="button">DOTS<span class="g">stream</span></button>
        <button class="pill" type="button">DP<span class="g">classic</span></button>
        <button class="pill" type="button">SQUISH<span class="g">keep %</span></button>
      </div>
      <div class="header-row" id="headerStrip" aria-label="Header Compare strip">
        <span style="color:var(--text-dim);font-size:12px;font-weight:600">Compare:</span>
        <button class="pill" type="button">DOTS<span class="g">stream</span></button>
        <button class="pill" type="button">DP<span class="g">classic</span></button>
        <button class="pill" type="button">SQUISH<span class="g">keep %</span></button>
        <button class="pill" type="button" style="background:var(--accent);color:#fff;border-color:var(--accent)">Run</button>
      </div>
      <div class="map">
        <span class="tag start">start</span>
        <span class="tag cur">current</span>
      </div>
    </div>
  </div>
  <p class="ok" id="check">Measuring…</p>
</section>
<script>
  const strip = document.getElementById("headerStrip");
  const after = document.getElementById("after");
  const row = getComputedStyle(strip).flexWrap;
  const scroll = document.documentElement.scrollWidth;
  const glosses = [...document.querySelectorAll("#resultsPills .g")].map((n) => n.textContent.trim());
  const headerHidden = [...document.querySelectorAll("#headerStrip .g")].every((n) => getComputedStyle(n).display === "none");
  const canvasLabel = after.querySelector(".map .tag.cur").textContent.trim();
  const canvasOk = canvasLabel === "current";
  document.getElementById("check").textContent =
    `Results glosses=[${glosses.join(", ")}] headerGlossHidden=${headerHidden} ` +
    `headerWrap=${row} scrollWidth=${scroll} canvasLabel=${canvasLabel} ok=${canvasOk && headerHidden && glosses.length === 3}`;
</script>
</body>
</html>
